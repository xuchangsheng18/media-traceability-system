repos:
  - repo: local
    hooks:
      - id: development-static-and-secrets
        name: Locked CPU development static and secret checks
        entry: /opt/conda/glwy/envs/py311/bin/python scripts/dev.py pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
# Explicit selected Linux checkout installation: scripts/stage_three_quality.py install-hook.
