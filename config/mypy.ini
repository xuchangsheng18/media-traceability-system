[mypy]
python_version = 3.10
show_error_codes = True
plugins = pydantic.mypy
check_untyped_defs = True
warn_unused_ignores = True
no_implicit_optional = True
disallow_any_generics = True
namespace_packages = True
explicit_package_bases = True
exclude = (^|/)(\.superpowers|node_modules|\.git|__pycache__)/

# These locked dynamic clients do not publish usable py.typed declarations.
# Missing-import exceptions are limited to these exact dependency namespaces.
[mypy-boto3,boto3.*,botocore,botocore.*]
ignore_missing_imports = True

[mypy-celery,celery.*]
ignore_missing_imports = True

[mypy-kombu,kombu.*]
ignore_missing_imports = True

[mypy-business_app,business_app.*]
disallow_untyped_defs = True
warn_return_any = True
