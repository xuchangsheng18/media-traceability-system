  type: engineering_elaboration_of_source_task
  source_task_id: T005
  source_design: DES-001 V1.4 §8.6、§8.11、§9.6、§10.9；本书§7补充技术验证。
  scope: 配置Ruff/Black或等价工具、mypy、ESLint、Prettier和提交前检查。
