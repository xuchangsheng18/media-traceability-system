components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 服务端验证令牌有效期/撤销/主体；正式身份协议待确认。
  schemas:
    Uuid:
      type: string
      format: uuid
    Sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    TimeRange:
      type: object
      properties:
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 1
      required:
      - start_ms
      - end_ms
      additionalProperties: false
      description: '[start_ms,end_ms)；语义校验要求end_ms>start_ms，并不超过媒体范围。'
    BoundingBox:
      type: object
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        height:
          type: number
          exclusiveMinimum: 0
          maximum: 1
      required:
      - x
      - y
      - width
      - height
      additionalProperties: false
      description: 原件归一化坐标；语义校验x+width<=1,y+height<=1。
    ObjectRef:
      type: object
      properties:
        object_id:
          type: string
          format: uuid
        version_id:
          type: string
          minLength: 1
          maxLength: 128
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - object_id
      - version_id
      - sha256
      additionalProperties: false
      description: 只给受控标识，不给绕过鉴权的存储密钥或永久URL。
    VersionBinding:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        run_version:
          type: integer
          minimum: 1
        result_version:
          type: integer
          minimum: 1
        policy_version:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - task_id
      - run_version
      - result_version
      - policy_version
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 4096
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 4096
        request_id:
          type: string
          format: uuid
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 128
              reason:
                type: string
                minLength: 1
                maxLength: 4096
            required:
            - field
            - reason
            additionalProperties: false
          minItems: 0
        instance:
          type: string
          format: uri-reference
      required:
      - type
      - title
      - status
      - code
      - message
      - request_id
      - details
      additionalProperties: false
    Accepted:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - CREATED
          - QUEUED
          - RUNNING
          - CANCEL_REQUESTED
        status_url:
          type: string
          pattern: ^/api/v1/analysis/tasks/
      required:
      - task_id
      - state
      - status_url
      additionalProperties: false
    ActionAck:
      type: object
      properties:
        object_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        state:
          type: string
          minLength: 1
          maxLength: 128
        request_id:
          type: string
          format: uuid
      required:
      - object_id
      - version
      - state
      - request_id
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        request_id:
          type: string
          format: uuid
      required:
      - status
      - request_id
      additionalProperties: false
      description: 对外仅给聚合状态；版本、拓扑、依赖错误只对运维授权可见。
    AuthLogin:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - username
      - password
      additionalProperties: false
      description: 仅开发适配器；正式统一身份接入方式待定。
    AuthSession:
      type: object
      properties:
        access_token:
          type: string
          minLength: 1
        token_type:
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
      required:
      - access_token
      - token_type
      - expires_in
      additionalProperties: false
      description: 不得在日志或测试证据中记录令牌。
    CurrentUser:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          minItems: 0
        permissions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          minItems: 0
        case_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
      required:
      - user_id
      - org_id
      - roles
      - permissions
      - case_ids
      additionalProperties: false
    SourceCreate:
      type: object
      properties:
        case_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        source_type:
          type: string
          enum:
          - authorized_business
          - public_licensed
          - user_submission
          - synthetic
        authorization_ref:
          type: string
          minLength: 1
          maxLength: 128
        purpose:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          minItems: 1
          uniqueItems: true
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - case_id
      - name
      - source_type
      - authorization_ref
      - purpose
      - expires_at
      additionalProperties: false
      description: 提交不等于审批授权；服务端核验授权记录，返回pending或verified。
    Source:
      type: object
      properties:
        source_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        source_type:
          type: string
          enum:
          - authorized_business
          - public_licensed
          - user_submission
          - synthetic
        authorization_ref:
          type: string
          minLength: 1
          maxLength: 128
        purpose:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          minItems: 1
          uniqueItems: true
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        authorization_status:
          type: string
          enum:
          - pending
          - verified
          - expired
          - revoked
        version:
          type: integer
          minimum: 1
      required:
      - source_id
      - case_id
      - name
      - source_type
      - authorization_ref
      - purpose
      - expires_at
      - authorization_status
      - version
      additionalProperties: false
    UploadCreate:
      type: object
      properties:
        case_id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        filename:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 1
        mime:
          type: string
          minLength: 1
          maxLength: 128
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - case_id
      - source_id
      - filename
      - size_bytes
      - mime
      - sha256
      additionalProperties: false
      description: 分片尺寸和总大小上限由经审核配置确定；文件名只作显示，不能形成系统路径。
    UploadSession:
      type: object
      properties:
        upload_id:
          type: string
          format: uuid
        part_size_bytes:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - UPLOADING
          - VALIDATING
          - COMPLETED
          - REJECTED
          - EXPIRED
        expires_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
      required:
      - upload_id
      - part_size_bytes
      - state
      - expires_at
      - version
      additionalProperties: false
    UploadPart:
      type: object
      properties:
        part_no:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size_bytes:
          type: integer
          minimum: 1
      required:
      - part_no
      - sha256
      - size_bytes
      additionalProperties: false
    UploadComplete:
      type: object
      properties:
        parts:
          type: array
          items:
            $ref: '#/components/schemas/UploadPart'
          minItems: 1
      required:
      - parts
      additionalProperties: false
      description: parts按part_no连续覆盖；服务端复算完整大小与SHA-256。
    UploadResult:
      type: object
      properties:
        upload_id:
          type: string
          format: uuid
        asset_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        validation:
          type: string
          enum:
          - VALIDATING
          - VALID
          - REJECTED
        duplicate_of:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        request_id:
          type: string
          format: uuid
      required:
      - upload_id
      - asset_id
      - validation
      - duplicate_of
      - request_id
      additionalProperties: false
      description: 仅VALID且授权生效的资产可分析；duplicate_of只暴露当前有权对象。
    Asset:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - original
          - derived
        object_ref:
          $ref: '#/components/schemas/ObjectRef'
        mime:
          type: string
          minLength: 1
          maxLength: 128
        size_bytes:
          type: integer
          minimum: 1
        duration_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        width:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        height:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        state:
          type: string
          enum:
          - VALIDATING
          - VALID
          - QUARANTINED
          - ARCHIVED
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
      required:
      - asset_id
      - case_id
      - content_id
      - source_id
      - kind
      - object_ref
      - mime
      - size_bytes
      - duration_ms
      - width
      - height
      - state
      - version
      - created_at
      additionalProperties: false
    ImportEntry:
      type: object
      properties:
        source_id:
          type: string
          format: uuid
        object_ref:
          $ref: '#/components/schemas/ObjectRef'
        filename:
          type: string
          minLength: 1
          maxLength: 128
        mime:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - source_id
      - object_ref
      - filename
      - mime
      additionalProperties: false
    ImportRequest:
      type: object
      properties:
        case_id:
          type: string
          format: uuid
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ImportEntry'
          minItems: 1
      required:
      - case_id
      - entries
      additionalProperties: false
    ImportStatus:
      type: object
      properties:
        import_id:
          type: string
          format: uuid
        state:
          type: string
          minLength: 1
          maxLength: 128
        items:
          type: array
          items:
            type: object
            properties:
              ordinal:
                type: integer
                minimum: 0
              asset_id:
                anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              state:
                type: string
                enum:
                - pending
                - accepted
                - rejected
              error_code:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: 'null'
            required:
            - ordinal
            - asset_id
            - state
            - error_code
            additionalProperties: false
          minItems: 0
      required:
      - import_id
      - state
      - items
      additionalProperties: false
    TaskCreate:
      type: object
      properties:
        case_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        scene:
          type: string
          enum:
          - accident_rumor
          - harmful_content
          - repost_tamper_trace
        policy_version:
          type: string
          minLength: 1
          maxLength: 128
        modules:
          type: array
          items:
            type: string
            enum:
            - INGEST
            - RESOURCE
            - MEDIA
            - RISK
            - FORENSIC
            - IMGRET
            - VIDTRACE
            - ORIGIN
            - PROPAGATION
            - CLAIM
            - REVIEW
            - OPS
          minItems: 1
          uniqueItems: true
        priority:
          type: string
          enum:
          - low
          - normal
          - high
      required:
      - case_id
      - asset_id
      - scene
      - policy_version
      - modules
      - priority
      additionalProperties: false
      description: 场景枚举为源三类场景的工程代号；正式适用范围待审核。
    NodeStatus:
      type: object
      properties:
        node_code:
          type: string
          minLength: 1
          maxLength: 128
        state:
          type: string
          enum:
          - PENDING
          - READY
          - RUNNING
          - SUCCEEDED
          - FAILED
          - SKIPPED
          - DEFERRED
          - CANCELLED
          - NOT_SUPPORTED
        attempt:
          type: integer
          minimum: 0
        reason:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        required:
          type: boolean
