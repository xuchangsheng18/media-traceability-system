openapi: 3.1.0
info:
  title: 内部模型推理契约草案
  version: 0.1.0-review
servers:
- url: /internal/v1
security:
- serviceAuth: []
paths:
  /inference/{capability}:
    post:
      operationId: internalInference
      parameters:
      - name: capability
        in: path
        required: true
        schema:
          type: string
          enum:
          - risk.image_classification
          - risk.object_detection
          - risk.small_object
          - risk.video_action
          - risk.temporal_event
          - risk.audio_event
          - risk.consistency
          - risk.fusion
          - forensic.image_localization
          - forensic.tamper_type
          - forensic.video_temporal
          - forensic.video_spatial
          - forensic.deepfake
          - forensic.avsync
          - retrieval.image_embedding
          - retrieval.local_features
          - retrieval.local_match
          - retrieval.geometry
          - retrieval.frame_embedding
          - retrieval.temporal_alignment
          - retrieval.segment_localizer
          - retrieval.source_boundary
          - origin.content_cluster
          - origin.first_source_rank
          - model.calibration
          - propagation.path
          - propagation.inferred_edge
          - claim.extract
          - claim.evidence_relation
          - claim.grounding
          - media.ocr
          - media.asr
          - media.audio_fingerprint
          - model.compression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $schema: https://json-schema.org/draft/2020-12/schema
                $id: urn:media-trace:model:M01:request:0.1.0
                type: object
                properties:
                  request_id:
                    type: string
                    format: uuid
                  case_id:
                    type: string
                    format: uuid
                  task_id:
                    type: string
                    format: uuid
                  run_version:
                    type: integer
                    minimum: 1
                  capability:
                    const: risk.image_classification
                  model_name:
                    type: string
                    minLength: 1
                    maxLength: 128
                  model_version:
                    type: string
                    minLength: 1
                    maxLength: 128
                  input_kind:
                    const: decoded_original
                  asset_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    minItems: 1
                    uniqueItems: true
                  object_refs:
                    type: array
                    items:
                      type: object
                      properties:
                        object_id:
                          type: string
                          format: uuid
                        version_id:
                          type: string
                          minLength: 1
                          maxLength: 128
                        sha256:
                          type: string
                          pattern: ^[a-f0-9]{64}$
                      required:
                      - object_id
                      - version_id
                      - sha256
                      additionalProperties: false
                      description: 只给受控标识，不给绕过鉴权的存储密钥或永久URL。
                    minItems: 0
                  source_segment_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    minItems: 0
                  preprocessing_version:
                    type: string
                    minLength: 1
                    maxLength: 128
                  mapping_version:
                    type: string
                    minLength: 1
                    maxLength: 128
                  missing_modalities:
                    type: array
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                    minItems: 0
                    uniqueItems: true
                  deadline_at:
                    type: string
                    format: date-time
                  authorization_version:
                    type: string
                    minLength: 1
                    maxLength: 128
                required:
                - request_id
                - case_id
                - task_id
                - run_version
                - capability
                - model_name
                - model_version
                - input_kind
                - asset_ids
                - object_refs
                - source_segment_ids
                - preprocessing_version
                - mapping_version
                - missing_modalities
                - deadline_at
                - authorization_version
