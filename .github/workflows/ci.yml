name: T015 isolated targeted probe
'on':
  push:
    branches:
    - feat/t001-t012-closeout-t015-probe-p04-red2-20261020T143858Z
permissions:
  contents: read
jobs:
  isolated-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHON: /opt/conda/glwy/envs/py310/bin/python
      PYTHONPATH: ${{ github.workspace }}/backend
      PYTHONDONTWRITEBYTECODE: '1'
      MT_DOCKER_CONTEXT: default
      MT_BUSINESS_TEST_ADMIN_DSN: host=127.0.0.1 port=35432 dbname=postgres user=mt_test_admin
        password=self-owned-ephemeral-ci-only
      MT_BUSINESS_TEST_BROKER_URL: amqp://mt_business_ci:self-owned-ephemeral-ci-only@127.0.0.1:14673/mt_business_ci
      MT_BUSINESS_PG_BIN: /usr/lib/postgresql/16/bin
    services:
      business-postgres:
        image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: mt_test_admin
          POSTGRES_PASSWORD: self-owned-ephemeral-ci-only
          POSTGRES_DB: postgres
        ports:
        - 35432:5432
        options: --health-cmd "pg_isready -U mt_test_admin -d postgres" --health-interval
          5s --health-timeout 3s --health-retries 12
      business-rabbit:
        image: rabbitmq@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
        env:
          RABBITMQ_DEFAULT_USER: mt_business_ci
          RABBITMQ_DEFAULT_PASS: self-owned-ephemeral-ci-only
          RABBITMQ_DEFAULT_VHOST: mt_business_ci
        ports:
        - 14673:5672
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
    - name: Configure isolated runtime paths
      shell: bash
      run: 'echo "MT_RUNTIME_DIR=$RUNNER_TEMP/media-trace-runtime" >> "$GITHUB_ENV"

        echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/media-trace-browsers" >> "$GITHUB_ENV"

        '
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.21.1
    - name: Recreate locked Miniforge py310 environment
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import json,os,urllib.request,hashlib,subprocess

        from pathlib import Path

        lock=json.loads(Path(''config/ci-bootstrap-lock.json'').read_text())[''miniforge'']

        target=Path(os.environ[''RUNNER_TEMP''])/''miniforge.sh''

        urllib.request.urlretrieve(lock[''url''],target)

        assert hashlib.sha256(target.read_bytes()).hexdigest()==lock[''sha256'']

        subprocess.run([''bash'',str(target),''-b'',''-p'',os.environ[''RUNNER_TEMP'']+''/miniforge''],check=True)

        PY

        sudo mkdir -p /opt/conda/glwy/envs

        sudo chown "$(id -u):$(id -g)" /opt/conda/glwy/envs

        "$RUNNER_TEMP/miniforge/bin/conda" create -y -p /opt/conda/glwy/envs/py310
        --file config/locks/conda-linux-64.explicit.txt

        "$PYTHON" -m pip install -r config/locks/requirements-py310.lock

        '
    - name: Install existing independently locked type tools
      run: '"$PYTHON" scripts/stage_three_types.py setup'
    - name: Run exact targeted isolated tests with private raw logs
      run: '"$PYTHON" scripts/t015_hosted_probe_private.py'
    - name: Preserve sanitized probe report only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: t015-isolated-probe-${{ github.run_id }}
        path: ${{ runner.temp }}/t015-probe-report.json
        retention-days: 14
