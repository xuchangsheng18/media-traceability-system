name: py310 CPU engineering
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/00-project/validation/**'
      - 'docs/00-project/repository-file-manifest.json'
      - 'docs/00-project/server-sync-receipt.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: py310-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHON: /opt/conda/glwy/envs/py310/bin/python
      PYTHONPATH: ${{ github.workspace }}/backend
      PYTHONDONTWRITEBYTECODE: '1'
      MT_DOCKER_CONTEXT: default
    steps:
      - name: Configure isolated runtime paths
        shell: bash
        run: |
          echo "MT_RUNTIME_DIR=$RUNNER_TEMP/media-trace-runtime" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/media-trace-browsers" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.1
      - name: Recreate locked Miniforge py310 environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,hashlib,subprocess
          from pathlib import Path
          lock=json.loads(Path('config/ci-bootstrap-lock.json').read_text())['miniforge']
          target=Path(os.environ['RUNNER_TEMP'])/'miniforge.sh'
          urllib.request.urlretrieve(lock['url'],target)
          assert hashlib.sha256(target.read_bytes()).hexdigest()==lock['sha256']
          subprocess.run(['bash',str(target),'-b','-p',os.environ['RUNNER_TEMP']+'/miniforge'],check=True)
          PY
          sudo mkdir -p /opt/conda/glwy/envs
          sudo chown "$(id -u):$(id -g)" /opt/conda/glwy/envs
          "$RUNNER_TEMP/miniforge/bin/conda" create -y -p /opt/conda/glwy/envs/py310 --file config/locks/conda-linux-64.explicit.txt
          "$PYTHON" -m pip install -r config/locks/requirements-py310.lock
      - name: Install locked UI and browser
        shell: bash
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend exec -- playwright install chromium --only-shell --with-deps
      - name: Validate phase materials and navigation
        run: |
          "$PYTHON" -m ruff check --config ruff.toml scripts/validate_stage_one.py scripts/update_docs_navigation.py scripts/stage_one_source_audit.py scripts/build_stage_one_candidate.py scripts/generate_interface_docs.py scripts/validate_interface_docs.py scripts/generate_phase_readiness.py scripts/validate_phase_readiness.py scripts/collect_readiness_resources.py scripts/plan_project_schedule.py scripts/evaluate_acceptance_metrics.py scripts/validate_stage_one_completion.py
          "$PYTHON" -m ruff check --config ruff.toml scripts/stage_one_controls.py scripts/validate_stage_one_controls.py scripts/generate_workflow_types.py scripts/verify_generated_contracts.py
          "$PYTHON" -m ruff check --config ruff.toml scripts/plan_placeholder_schedule.py
          "$PYTHON" -m ruff check --config ruff.toml scripts/verify_stage_two_isolation.py scripts/verify_stage_two_media.py scripts/stage_two_readiness.py scripts/collect_stage_two_software.py scripts/validate_stage_two_completion.py
          "$PYTHON" scripts/plan_placeholder_schedule.py --check
          "$PYTHON" scripts/stage_one_controls.py
          "$PYTHON" scripts/validate_stage_one_controls.py
          "$PYTHON" scripts/plan_project_schedule.py --check
          "$PYTHON" scripts/validate_stage_one_completion.py
          "$PYTHON" scripts/generate_phase_readiness.py --check
          "$PYTHON" scripts/validate_phase_readiness.py
          "$PYTHON" scripts/generate_interface_docs.py --check
          "$PYTHON" scripts/validate_interface_docs.py
          "$PYTHON" scripts/validate_stage_one.py
          "$PYTHON" scripts/validate_repository_docs.py
          "$PYTHON" scripts/validate_documentation_completion.py
      - name: Run actual engineering gates
        run: |
          "$PYTHON" scripts/run_ci.py all
          "$PYTHON" scripts/verify_ci_failure_gate.py
          "$PYTHON" scripts/check_repository_secrets.py
      - name: Preserve non-secret validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: py310-validation-${{ github.run_id }}
          retention-days: 14
          path: |
            docs/00-project/validation/*report.json
            docs/00-project/validation/image-sbom.spdx.json
            docs/00-project/validation/poc-ui.png
      - name: Stop ephemeral development services
        if: always()
        shell: bash
        run: |
          if [ -x "$PYTHON" ]; then "$PYTHON" scripts/poc_control.py down; fi
