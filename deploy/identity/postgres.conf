listen_addresses = '*'
ssl = on
ssl_cert_file = '/etc/identity/tls.crt'
ssl_key_file = '/etc/identity/tls.key'
ssl_ca_file = '/etc/identity/ca.crt'
password_encryption = 'scram-sha-256'
hba_file = '/etc/identity/pg_hba.conf'
log_statement = 'none'
log_min_error_statement = 'panic'
max_connections = 40
shared_buffers = '256MB'
