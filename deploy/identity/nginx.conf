worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  log_format privacy '$remote_addr $request_method $uri $status';
  access_log /dev/stdout privacy;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  client_max_body_size 1m;
  server_tokens off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /etc/identity/tls.crt;
  ssl_certificate_key /etc/identity/tls.key;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/identity/ca.crt;
  proxy_ssl_server_name on;
  proxy_ssl_name keycloak;
  proxy_connect_timeout 2s;
  proxy_read_timeout 30s;
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Port $identity_port;
  proxy_set_header Host $http_host;
  map $server_port $identity_port { 8443 18443; 8444 18444; }
  map $request_uri $bad_path { default 0; ~*^[^?]*%(25|2f|5c|00) 1; }
  upstream identity { server keycloak:8443; }
  server {
    listen 8443 ssl default_server;
    server_name 172.16.58.179;
    if ($http_host != "172.16.58.179:18443") { return 400; }
    if ($bad_path) { return 400; }
    location ~* ^/(admin|health|metrics)(/|$) { return 404; }
    location /realms/ { proxy_pass https://identity; }
    location /resources/ { proxy_pass https://identity; }
    location = / { return 302 /realms/media-trace/account/; }
    location / { return 404; }
  }
  server {
    listen 8444 ssl default_server;
    server_name localhost;
    if ($http_host != "localhost:18444") { return 400; }
    if ($bad_path) { return 400; }
    location ~* ^/(health|metrics)(/|$) { return 404; }
    location / { proxy_pass https://identity; }
  }
}
