resolver 127.0.0.11 valid=5s ipv6=off;
log_format mt_safe '$request_method $status $request_time';
upstream mt_api {
 zone mt_api 64k;
 server api:8000 resolve;
}
server {
 # Override the image's inherited default access/error logs at the server level.
 access_log /dev/stdout mt_safe;
 error_log /dev/null;
 listen 80;
 server_tokens off;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location / { root /usr/share/nginx/html; try_files $uri /index.html; }
 location /poc/ { proxy_pass http://mt_api; proxy_read_timeout 30s; }
 location /api/ { proxy_pass http://mt_api; }
 location = /healthz { proxy_pass http://mt_api; }
}
